<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Chat</title>
    <link rel="stylesheet" type="text/css" href="font-awesome.css" />
    <link id="sheetofstyles" rel="stylesheet" type="text/css" href="browserOutput.css" />
    <script type="text/javascript" src="purify.min.js"></script>
    <style>
        /* Styling for context menu with frosted glass effect */
        #contextMenu {
            display: none;
            position: absolute;
            background: rgba(82, 80, 80, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            width: 150px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        #contextMenu ul {
            margin: 0;
            padding: 0;
            list-style-type: none;
        }

        #contextMenu li {
            padding: 8px;
            cursor: pointer;
            border-radius: 8px;
        }

        #contextMenu li:hover {
            background-color: rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div id="loading">
        <i class="fas fa-spinner fa-2x"></i>
        <div>
            Loading...<br><br>
            If this takes longer than 30 seconds, it will automatically reload a maximum of 5 times.<br>
            If it <b>still</b> doesn't work, use the bug report button at the top right of the window.
        </div>
    </div>

    <div id="messages"></div>

    <div id="chat-decor"></div>

    <div id="userBar" style="display: none;">
        <div id="audio">
            <a href="#" class="subCell toggle" id="toggleAudio" title="Audio"><i class="fas fa-volume-up"></i></a>
        </div>
        <div id="options">
            <a href="#" class="subCell toggle" id="toggleOptions" title="Options"><i class="fas fa-cog"></i></a>
        </div>
        <div class="sub" id="subOptions">
            <a href="#" class="subCell decreaseFont topCell" id="decreaseFont"><span>Decrease font size</span> <i class="fas fa-font"></i></a>
            <a href="#" class="subCell increaseFont" id="increaseFont"><span>Increase font size</span> <i class="fas fa-font"></i></a>
            <a href="#" class="subCell highlightTerm" id="highlightTerm"><span>Highlight string</span> <i class="fas fa-tag"></i></a>
            <a href="#" class="subCell toggleCombine" id="toggleCombine"><span>Toggle line combining</span> <i class="fas fa-filter"></i></a>
        </div>
        <div class="sub" id="subAudio">
            <span class="subCell topCell" id="musicVolumeSpan"><input type="range" class="hidden" id="musicVolume"><span id="musicVolumeText">Admin music volume</span><i class="fas fa-music"></i></span>
        </div>
    </div>

    <!-- Context menu -->
    <div id="contextMenu">
        <ul></ul>
    </div>

    <audio id="adminMusic" preload="none"></audio>
    <div id="ping" style="display: none;">
        <i class="fas fa-circle" id="pingDot"></i>
        <span class="ms" id="pingMs">--ms</span>
    </div>

    <script type="text/javascript" src="errorHandler.js"></script>
    <script type="text/javascript" src="browserOutput.js"></script>

    <script type="text/javascript">
        // Context menu functionality - vanilla JS
        (function() {
            const contextMenu = document.getElementById('contextMenu');
            const contextMenuList = contextMenu.querySelector('ul');
            
            // Store reference for use in browserOutput.js
            window.$contextMenu = contextMenu;

            document.getElementById('messages').addEventListener('contextmenu', function(e) {
                const sayElement = e.target.closest('.say');
                if (!sayElement) return;
                
                e.preventDefault();

                const optionsAttr = sayElement.getAttribute('data-options');
                const flagsAttr = sayElement.getAttribute('visible-flags');
                const target = sayElement.getAttribute('target-ref');

                if (!optionsAttr || !flagsAttr) return;

                let options, currentUserPermissions;
                try {
                    options = JSON.parse(optionsAttr);
                    currentUserPermissions = JSON.parse(flagsAttr);
                } catch (err) {
                    console.error('Failed to parse context menu data:', err);
                    return;
                }

                // Clear existing menu items
                contextMenuList.innerHTML = '';

                // Build menu items based on permissions
                options.forEach(function(option) {
                    const normalizedOption = option.trim().toLowerCase();
                    const hasPermission = currentUserPermissions.some(function(permission) {
                        return permission.trim().toLowerCase() === normalizedOption;
                    });

                    if (hasPermission) {
                        const listItem = document.createElement('li');
                        listItem.textContent = option;
                        listItem.addEventListener('click', function() {
                            runByond('?_src_=chat&admin_command=' + option + '&target=' + target);
                            contextMenu.style.display = 'none';
                        });
                        contextMenuList.appendChild(listItem);
                    }
                });

                // Position the menu
                const windowHeight = window.innerHeight;
                const menuHeight = contextMenu.offsetHeight || 100;
                const mouseY = e.pageY;
                const spaceBelow = windowHeight - mouseY;

                if (spaceBelow < menuHeight) {
                    contextMenu.style.top = (mouseY - menuHeight - 5) + 'px';
                } else {
                    contextMenu.style.top = (mouseY + 5) + 'px';
                }
                contextMenu.style.left = (e.pageX + 5) + 'px';
                contextMenu.style.display = 'block';
            });

            // Hide context menu when clicking elsewhere
            document.addEventListener('click', function(e) {
                if (!e.target.closest('#contextMenu') && !e.target.closest('#messages')) {
                    contextMenu.style.display = 'none';
                }
            });

            // Prevent menu from closing when clicking on it
            contextMenu.addEventListener('mousedown', function(e) {
                e.stopPropagation();
            });
        })();
    </script>
</body>
</html>
