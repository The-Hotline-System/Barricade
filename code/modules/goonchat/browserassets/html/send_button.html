<!doctype html>
<html>
	<head>
		<meta charset="UTF-8" />
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			body {
				font-family: Arial, sans-serif;
				background-color: #1a1a1a;
				height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 2px;
				overflow: hidden;
			}
			#send-button {
				background-color: #2d5d2d;
				color: #fff;
				border: 1px solid #3d7d3d;
				padding: 0 8px;
				cursor: pointer;
				font-size: 10px;
				font-weight: 700;
				transition: background-color 0.1s;
				user-select: none;
				width: 100%;
				height: 100%;
			}
			#send-button.say {
				background-color: #2d5d2d;
				border-color: #3d7d3d;
			}
			#send-button.whisper {
				background-color: #2d4d4d;
				border-color: #3d6d6d;
			}
			#send-button.me {
				background-color: #5d2d5d;
				border-color: #7d3d7d;
			}
			#send-button.ooc {
				background-color: #2d2d5d;
				border-color: #3d3d7d;
			}
			#send-button.cmd {
				background-color: #5d5d2d;
				border-color: #7d7d3d;
			}
			#send-button:hover {
				filter: brightness(1.2);
			}
			#send-button:active {
				filter: brightness(0.8);
			}
		</style>
	</head>
	<body>
		<button id="send-button" class="say">SEND</button>
		<script>
			const sendButton = document.getElementById("send-button");

			// Function to update button mode - called from BYOND
			window.updateButtonMode = function (mode) {
				sendButton.className = mode;
			};

			sendButton.addEventListener("click", (e) => {
				e.preventDefault();
				// Trigger send via BYOND
				window.location = `byond://?_src_=chat;sendButtonClick=1`;
			});
		</script>
	</body>
</html>
