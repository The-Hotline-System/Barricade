<!doctype html>
<html>
	<head>
		<meta charset="UTF-8" />
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			body {
				font-family: Arial, sans-serif;
				background-color: #1a1a1a;
				height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 2px;
				overflow: hidden;
			}
			#command-bar-container {
				display: flex;
				width: 100%;
				max-width: 800px;
				height: 100%;
				gap: 2px;
				align-items: stretch;
			}
			#mode-button {
				background-color: #2d2d2d;
				color: #fff;
				border: 1px solid #444;
				padding: 0 8px;
				cursor: pointer;
				font-size: 10px;
				font-weight: 700;
				width: 40px;
				text-align: center;
				transition: background-color 0.1s;
				user-select: none;
			}
			#mode-button:hover {
				background-color: #3d3d3d;
			}
			#mode-button:active {
				background-color: #1d1d1d;
			}
			#mode-button.say {
				background-color: #2d5d2d;
				border-color: #3d7d3d;
			}
			#mode-button.me {
				background-color: #5d2d5d;
				border-color: #7d3d7d;
			}
			#mode-button.ooc {
				background-color: #2d2d5d;
				border-color: #3d3d7d;
			}
			#mode-button.cmd {
				background-color: #5d5d2d;
				border-color: #7d7d3d;
			}
			#input-wrapper {
				flex: 1;
				position: relative;
				display: flex;
			}
			#command-input {
				width: 100%;
				height: 100%;
				background-color: #2d2d2d;
				color: #fff;
				border: 1px solid #444;
				padding: 0 6px;
				font-size: 11px;
				font-family: "Courier New", monospace;
			}
			#command-input:focus {
				outline: 0;
				border-color: #666;
				background-color: #333;
			}
			#send-button {
				background-color: #2d5d2d;
				color: #fff;
				border: 1px solid #3d7d3d;
				padding: 0 8px;
				cursor: pointer;
				font-size: 10px;
				font-weight: 700;
				transition: background-color 0.1s;
				user-select: none;
				width: 45px;
			}
			#send-button.say {
				background-color: #2d5d2d;
				border-color: #3d7d3d;
			}
			#send-button.me {
				background-color: #5d2d5d;
				border-color: #7d3d7d;
			}
			#send-button.ooc {
				background-color: #2d2d5d;
				border-color: #3d3d7d;
			}
			#send-button.cmd {
				background-color: #5d5d2d;
				border-color: #7d7d3d;
			}
			#send-button:hover {
				filter: brightness(1.2);
			}
			#send-button:active {
				filter: brightness(0.8);
			}
		</style>
	</head>
	<body>
		<div id="command-bar-container">
			<button id="mode-button" class="say">SAY</button>
			<div id="input-wrapper">
				<input
					type="text"
					id="command-input"
					placeholder="Type your message..."
					autocomplete="off"
					autofocus
				/>
			</div>
			<button id="send-button">SEND</button>
		</div>
		<script>
			const modes = ["say", "me", "ooc", "cmd"];
			let currentModeIndex = 0;
			const modeButton = document.getElementById("mode-button");
			const commandInput = document.getElementById("command-input");
			const sendButton = document.getElementById("send-button");
			function updateMode() {
				const mode = modes[currentModeIndex];
				modeButton.textContent = mode.toUpperCase();
				modeButton.className = mode;
				sendButton.className = mode;
				const placeholders = {
					say: "Say something...",
					me: "Describe an action...",
					ooc: "Out of character...",
					cmd: "Enter command...",
				};
				commandInput.placeholder = placeholders[mode];
			}
			function cycleMode() {
				currentModeIndex = (currentModeIndex + 1) % modes.length;
				updateMode();
				commandInput.focus();
			}
			function sendCommand() {
				const text = commandInput.value.trim();
				if (!text) return;
				const mode = modes[currentModeIndex];
				let command = mode === "cmd" ? text : `${mode} "${text}"`;
				const params = new URLSearchParams(window.location.search);
				const src = params.get("src") || "";
				window.location = `?src=${src};proc=command;param[command]=${encodeURIComponent(command)}`;
				commandInput.value = "";
				commandInput.focus();
			}
			modeButton.addEventListener("click", (e) => {
				e.preventDefault();
				cycleMode();
			});
			sendButton.addEventListener("click", (e) => {
				e.preventDefault();
				sendCommand();
			});
			commandInput.addEventListener("keydown", (e) => {
				if (e.key === "Enter") {
					e.preventDefault();
					sendCommand();
				}
			});
			document.addEventListener("click", (e) => {
				if (e.target !== modeButton && e.target !== sendButton)
					commandInput.focus();
			});
			updateMode();
		</script>
	</body>
</html>
